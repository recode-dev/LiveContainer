name: Build

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: xcode-27
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      # The xcode-27 runner image ships several Xcodes (27.0 / 27.1 / 27.2 ...)
      # and gains a new one on every image refresh, so any pinned version spec
      # (setup-xcode@v1 with e.g. '26.2') kills the whole job as soon as the
      # image moves on. Pick the newest installed Xcode instead - version
      # agnostic, works on xcode-26 / xcode-27 / macos-latest alike.
      - name: Select Xcode (newest installed)
        id: xcode
        run: |
          set -uo pipefail
          current="$(xcode-select -p 2>/dev/null || true)"
          echo "Default developer dir: ${current:-<none>}"

          # Python does the version sort: BSD/macOS `sort` has no portable -V,
          # and a lexical sort ranks Xcode_27.app above Xcode_27.2.app.
          best="$(/usr/bin/python3 - <<'PY'
          import glob, re
          def key(path):
              m = re.search(r'Xcode_([0-9]+(?:\.[0-9]+)*)', path)
              return tuple(int(x) for x in m.group(1).split('.')) if m else (0,)
          apps = glob.glob('/Applications/Xcode*.app')
          print(sorted(apps, key=key)[-1] if apps else '')
          PY
          )"
          echo "Newest installed: ${best:-<none>}"

          if [ -n "$best" ] && [ "$best/Contents/Developer" != "$current" ]; then
            echo "Switching to $best"
            # sudo -n never prompts: on a self-hosted runner a password prompt
            # would hang the job until the timeout.
            sudo -n xcode-select -s "$best" 2>/dev/null \
              || xcode-select -s "$best" 2>/dev/null \
              || echo "::warning::could not switch xcode-select to $best (keeping $current)"
          fi

          echo "Active developer dir: $(xcode-select -p)"
          if ! xcodebuild -version; then
            echo "::error::No usable Xcode toolchain on this runner"; exit 1
          fi
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: |
          set -uo pipefail
          # xcpretty is optional on self-hosted runners; fall back to raw output.
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release | xcpretty
            exit ${PIPESTATUS[0]}
          fi
          xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release

      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
        run: |
          python .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            
            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact2 }}
            .github/apps_nightly.json
      - name: Update apps.json in Release 1.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          files: |
            .github/apps_ss_lc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
